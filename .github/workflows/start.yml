name: Minecraft Paper Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Check if server exists
      id: check_server
      run: |
        if [ -f "server/paper.jar" ] && [ -f "server/eula.txt" ] && [ -f "server/server.properties" ]; then
          echo "✅ Найден существующий сервер!"
          echo "server_exists=true" >> $GITHUB_OUTPUT
        else
          echo "ℹ️ Сервер не найден, будет создан новый."
          echo "server_exists=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create server directories
      if: steps.check_server.outputs.server_exists == 'false'
      run: |
        mkdir -p server/plugins
        echo "✅ Папки server/plugins созданы"
    
    - name: Download Paper 1.19.2
      if: steps.check_server.outputs.server_exists == 'false'
      run: |
        echo "Скачиваем Paper 1.19.2..."
        wget -O server/paper.jar https://fill-data.papermc.io/v1/objects/2eb5c7459ec94bcdc597ed711d549a3ab4b0fda13e412a0792a1a069b5903864/paper-1.19.2-307.jar
        if [ ! -f server/paper.jar ] || [ ! -s server/paper.jar ]; then
          echo "❌ Ошибка скачивания Paper!"
          exit 1
        fi
        echo "✅ Paper скачан."
    
    - name: Download ProximaTunnel
      if: steps.check_server.outputs.server_exists == 'false'
      run: |
        echo "Скачиваем ProximaTunnel плагин..."
        
        # Пробуем скачать через API Modrinth
        VERSION_INFO=$(curl -s "https://api.modrinth.com/v2/project/ProximaTunnel/version")
        DOWNLOAD_URL=$(echo $VERSION_INFO | grep -o '"url":"[^"]*\.jar"' | head -1 | cut -d'"' -f4)
        
        if [ -n "$DOWNLOAD_URL" ]; then
          echo "Скачиваем с: $DOWNLOAD_URL"
          wget -O server/plugins/ProximaTunnel.jar $DOWNLOAD_URL
        else
          # Запасной вариант
          wget -O server/plugins/ProximaTunnel.jar https://cdn.modrinth.com/data/FzN6w5Cv/versions/1.0.0/ProximaTunnel-1.0.0.jar
        fi
        
        if [ -f server/plugins/ProximaTunnel.jar ] && [ -s server/plugins/ProximaTunnel.jar ]; then
          echo "✅ ProximaTunnel установлен!"
          ls -lh server/plugins/ProximaTunnel.jar
        else
          echo "⚠️ ProximaTunnel не скачался. Продолжаем без туннеля."
        fi
    
    - name: Create server.properties
      if: steps.check_server.outputs.server_exists == 'false'
      run: |
        cat > server/server.properties << 'EOF'
        # Основные настройки
        enable-jmx-monitoring=false
        rcon.port=25575
        gamemode=survival
        enable-command-block=false
        enable-query=false
        enforce-secure-profile=true
        level-name=world
        motd=SilentSMP
        query.port=25565
        pvp=true
        generate-structures=true
        difficulty=easy
        network-compression-threshold=256
        max-tick-time=60000
        require-resource-pack=false
        use-native-transport=true
        max-players=20
        online-mode=false
        enable-status=true
        allow-flight=false
        view-distance=10
        server-ip=0.0.0.0
        allow-nether=true
        server-port=25565
        sync-chunk-writes=true
        enable-rcon=false
        op-permission-level=4
        spawn-protection=16
        white-list=false
        EOF
        echo "✅ server.properties создан. motd=SilentSMP"
    
    - name: Create eula.txt
      if: steps.check_server.outputs.server_exists == 'false'
      run: |
        echo "eula=true" > server/eula.txt
        echo "✅ eula.txt создан"
    
    - name: Create restart script
      run: |
        cat > server/restart.sh << 'EOF'
        #!/bin/bash
        echo "🔄 Сервер перезапускается..."
        sleep 5
        cd server
        nohup java -Xmx1024M -Xms1024M -jar paper.jar nogui >> server.log 2>&1 &
        echo $! > server.pid
        echo "✅ Сервер перезапущен!"
        EOF
        chmod +x server/restart.sh
        echo "✅ restart.sh создан"
    
    - name: Start Minecraft server
      run: |
        echo "Запускаем Minecraft сервер..."
        cd server
        nohup java -Xmx1024M -Xms1024M -jar paper.jar nogui >> server.log 2>&1 &
        SERVER_PID=$!
        echo $SERVER_PID > server.pid
        echo "PID сервера: $SERVER_PID"
        
        echo "Ожидаем загрузки сервера..."
        for i in {1..12}; do
          sleep 5
          if grep -q "Done" server.log 2>/dev/null; then
            echo "✅ Сервер успешно запущен!"
            break
          fi
          if [ $i -eq 12 ]; then
            echo "❌ Сервер не запустился. Логи:"
            cat server.log
            exit 1
          fi
        done
        cd ..
    
    - name: Schedule restart
      run: |
        echo "⏱️ Таймер перезагрузки (через 5ч 50м)..."
        sleep 21000
        
        echo "⚠️ Сервер перезагрузится через 5 минут!"
        echo "say Сервер перезагрузится через 5 минут!" > server/stdin
        sleep 240
        
        echo "⚠️ Сервер перезагрузится через 1 минуту!"
        echo "say Сервер перезагрузится через 1 минуту!" > server/stdin
        sleep 50
        
        echo "⚠️ Сервер перезагрузится через 10 секунд!"
        echo "say Сервер перезагрузится через 10 секунд!" > server/stdin
        sleep 10
        
        echo "💾 Сохраняем мир..."
        echo "save-all" > server/stdin
        sleep 3
        echo "stop" > server/stdin
        sleep 10
        
        cd server
        ./restart.sh
        cd ..
        echo "✅ Сервер перезапущен!"
    
    - name: Save server files
      if: always()
      run: |
        echo "Сохраняем файлы сервера..."
        mkdir -p server_backup
        cp -r server/world server_backup/ 2>/dev/null || echo "Папка world не найдена"
        cp server/server.properties server_backup/ 2>/dev/null || echo "server.properties не найден"
        cp server/server.log server_backup/ 2>/dev/null || echo "server.log не найден"
        echo "✅ Файлы сохранены в server_backup/"
    
    - name: Commit and push
      if: always()
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add server/ server_backup/ || echo "Нет файлов для добавления"
        if ! git diff --staged --quiet; then
          git commit -m "🔄 Обновление файлов сервера [skip ci]"
          git push
          echo "✅ Изменения запушены!"
        else
          echo "ℹ️ Нет изменений для коммита."
        fi
    
    - name: Keep alive
      run: |
        echo ""
        echo "🟢 СЕРВЕР ЗАПУЩЕН!"
        echo "📍 Имя: SilentSMP (через ProximaTunnel)"
        echo "⏱️ Перезагрузка через 5ч 50м"
        echo "📝 Логи:"
        tail -f server/server.log
