name: Minecraft Paper Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Download Paper 1.19.2
      run: |
        wget -O paper.jar https://api.papermc.io/v2/projects/paper/versions/1.19.2/builds/latest/downloads/paper-1.19.2-latest.jar
    
    - name: Create server.properties
      run: |
        cat > server.properties << EOF
        # Minecraft server properties
        enable-jmx-monitoring=false
        rcon.port=25575
        level-seed=
        gamemode=survival
        enable-command-block=false
        enable-query=false
        generator-settings={}
        enforce-secure-profile=true
        level-name=world
        motd=GitHub Actions Minecraft Server
        query.port=25565
        pvp=true
        generate-structures=true
        max-chained-neighbor-updates=1000000
        difficulty=easy
        network-compression-threshold=256
        max-tick-time=60000
        require-resource-pack=false
        use-native-transport=true
        max-players=20
        online-mode=false
        enable-status=true
        allow-flight=false
        initial-disabled-packs=
        broadcast-rcon-to-ops=true
        view-distance=10
        server-ip=0.0.0.0
        resource-pack-prompt=
        allow-nether=true
        server-port=25565
        sync-chunk-writes=true
        enable-rcon=false
        op-permission-level=4
        prevent-proxy-connections=false
        hide-online-players=false
        resource-pack=
        entity-broadcast-range-percentage=100
        simulation-distance=10
        rcon.password=
        player-idle-timeout=0
        debug=false
        force-gamemode=false
        rate-limit=0
        hardcore=false
        white-list=false
        broadcast-console-to-ops=true
        spawn-npcs=true
        spawn-animals=true
        function-permission-level=2
        spawn-monsters=true
        enforce-whitelist=false
        spawn-protection=16
        resource-pack-sha1=
        max-world-size=29999984
        EOF
    
    - name: Create eula.txt
      run: echo "eula=true" > eula.txt
    
    - name: Start Minecraft server in background
      run: |
        nohup java -Xmx1024M -Xms1024M -jar paper.jar nogui &
        sleep 30
    
    - name: Install SSH client
      run: |
        sudo apt-get update
        sudo apt-get install -y openssh-client autossh
    
    - name: Create tunnel through Serveo
      run: |
        # Создаем туннель с фиксированным поддоменом
        ssh -o StrictHostKeyChecking=no -R SilentSMP.serveo.net:80:localhost:25565 serveo.net &
        
        # Альтернативный вариант с автоматическим выбором порта
        # ssh -o StrictHostKeyChecking=no -R 80:localhost:25565 serveo.net &
        
        sleep 10
        
        # Показываем URL для подключения
        echo "=================================================="
        echo "✅ Сервер доступен по адресу: SilentSMP.serveo.net"
        echo "📌 Порт: 25565 (стандартный порт Minecraft)"
        echo "=================================================="
    
    - name: Get tunnel info
      run: |
        echo "📍 Проверка статуса туннеля..."
        curl -s http://serveo.net/status || echo "Не удалось проверить статус"
    
    - name: Keep server running
      run: |
        echo "=================================================="
        echo "🟢 Minecraft сервер запущен!"
        echo "🌐 Подключайтесь по адресу: SilentSMP.serveo.net"
        echo "=================================================="
        echo ""
        echo "⚠️  ВАЖНО: Для подключения используйте прямой IP:"
        echo "   или используйте сторонний сервис для DNS"
        echo ""
        echo "📝 Логи сервера:"
        tail -f nohup.out
