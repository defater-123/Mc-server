name: Minecraft Paper Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Download Paper 1.19.2
      run: |
        # Используем прямую ссылку на последнюю стабильную сборку 312
        # SHA-256: 2eb5c7459ec94bcdc597ed711d549a3ab4b0fda13e412a0792a1a069b5903864
        echo "Скачиваем Paper 1.19.2 (сборка 312)..."
        wget -O paper.jar https://api.papermc.io/v2/projects/paper/versions/1.19.2/builds/312/downloads/paper-1.19.2-312.jar
        
        # Проверяем целостность файла
        if [ -f paper.jar ] && [ -s paper.jar ]; then
          echo "✅ Файл успешно скачан:"
          ls -lh paper.jar
          # Проверяем SHA-256
          echo "Проверка SHA-256:"
          sha256sum paper.jar
        else
          echo "❌ Ошибка скачивания через API, пробуем зеркало..."
          wget -O paper.jar https://download.papermc.io/paper/v1.19.2/paper-1.19.2-312.jar
        fi
        
        # Дополнительная проверка
        if [ ! -f paper.jar ] || [ ! -s paper.jar ]; then
          echo "❌ Не удалось скачать Paper. Останавливаем процесс."
          exit 1
        fi
    
    - name: Create server.properties
      run: |
        cat > server.properties << 'EOF'
        enable-jmx-monitoring=false
        rcon.port=25575
        level-seed=
        gamemode=survival
        enable-command-block=false
        enable-query=false
        generator-settings={}
        enforce-secure-profile=true
        level-name=world
        motd=GitHub Actions Minecraft Server
        query.port=25565
        pvp=true
        generate-structures=true
        max-chained-neighbor-updates=1000000
        difficulty=easy
        network-compression-threshold=256
        max-tick-time=60000
        require-resource-pack=false
        use-native-transport=true
        max-players=20
        online-mode=false
        enable-status=true
        allow-flight=false
        initial-disabled-packs=
        broadcast-rcon-to-ops=true
        view-distance=10
        server-ip=0.0.0.0
        resource-pack-prompt=
        allow-nether=true
        server-port=25565
        sync-chunk-writes=true
        enable-rcon=false
        op-permission-level=4
        prevent-proxy-connections=false
        hide-online-players=false
        resource-pack=
        entity-broadcast-range-percentage=100
        simulation-distance=10
        rcon.password=
        player-idle-timeout=0
        debug=false
        force-gamemode=false
        rate-limit=0
        hardcore=false
        white-list=false
        broadcast-console-to-ops=true
        spawn-npcs=true
        spawn-animals=true
        function-permission-level=2
        spawn-monsters=true
        enforce-whitelist=false
        spawn-protection=16
        resource-pack-sha1=
        max-world-size=29999984
        EOF
        
        echo "✅ server.properties создан"
    
    - name: Create eula.txt
      run: |
        echo "eula=true" > eula.txt
        echo "✅ eula.txt создан"
    
    - name: Start Minecraft server
      run: |
        echo "Запускаем Minecraft сервер..."
        nohup java -Xmx1024M -Xms1024M -jar paper.jar nogui &
        
        # Ждем загрузки сервера
        echo "Ожидаем загрузки сервера (30 секунд)..."
        sleep 30
        
        # Проверяем, запустился ли сервер
        if pgrep -f "paper.jar"; then
          echo "✅ Сервер успешно запущен!"
          echo "📊 Использование памяти:"
          ps aux | grep paper.jar | grep -v grep
        else
          echo "❌ Сервер не запустился. Проверьте логи:"
          tail -50 nohup.out
          exit 1
        fi
    
    - name: Setup Serveo tunnel
      run: |
        echo "Устанавливаем SSH клиент..."
        sudo apt-get update
        sudo apt-get install -y openssh-client
        
        echo "Создаем туннель через Serveo..."
        # Создаем туннель с фиксированным поддоменом
        ssh -o StrictHostKeyChecking=no -R SilentSMP.serveo.net:80:localhost:25565 serveo.net &
        
        sleep 15
        
        echo ""
        echo "=================================================="
        echo "✅ СЕРВЕР ЗАПУЩЕН И ДОСТУПЕН!"
        echo "📍 Адрес: SilentSMP.serveo.net"
        echo "🔌 Порт: 25565"
        echo "=================================================="
        echo ""
        echo "⚠️  Примечания:"
        echo "   - Если поддомен SilentSMP занят, измените его"
        echo "   - Туннель активен, пока работает этот workflow"
        echo "   - Для подключения используйте стандартный Minecraft клиент"
    
    - name: Keep server running
      run: |
        echo ""
        echo "🟢 Сервер работает и доступен по адресу SilentSMP.serveo.net:25565"
        echo "📝 Логи сервера:"
        echo "=================================================="
        tail -f nohup.out
