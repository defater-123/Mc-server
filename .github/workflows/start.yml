name: Minecraft Paper Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Download Paper 1.19.2
      run: |
        echo "Скачиваем Paper 1.19.2 (сборка 307)..."
        wget -O paper.jar https://fill-data.papermc.io/v1/objects/2eb5c7459ec94bcdc597ed711d549a3ab4b0fda13e412a0792a1a069b5903864/paper-1.19.2-307.jar
        
        if [ -f paper.jar ] && [ -s paper.jar ]; then
          echo "✅ Файл успешно скачан:"
          ls -lh paper.jar
        else
          echo "❌ Ошибка скачивания файла"
          exit 1
        fi
    
    - name: Create server.properties
      run: |
        cat > server.properties << 'EOF'
        enable-jmx-monitoring=false
        rcon.port=25575
        level-seed=
        gamemode=survival
        enable-command-block=false
        enable-query=false
        generator-settings={}
        enforce-secure-profile=true
        level-name=world
        motd=GitHub Actions Minecraft Server
        query.port=25565
        pvp=true
        generate-structures=true
        max-chained-neighbor-updates=1000000
        difficulty=easy
        network-compression-threshold=256
        max-tick-time=60000
        require-resource-pack=false
        use-native-transport=true
        max-players=20
        online-mode=false
        enable-status=true
        allow-flight=false
        initial-disabled-packs=
        broadcast-rcon-to-ops=true
        view-distance=10
        server-ip=0.0.0.0
        resource-pack-prompt=
        allow-nether=true
        server-port=25565
        sync-chunk-writes=true
        enable-rcon=false
        op-permission-level=4
        prevent-proxy-connections=false
        hide-online-players=false
        resource-pack=
        entity-broadcast-range-percentage=100
        simulation-distance=10
        rcon.password=
        player-idle-timeout=0
        debug=false
        force-gamemode=false
        rate-limit=0
        hardcore=false
        white-list=false
        broadcast-console-to-ops=true
        spawn-npcs=true
        spawn-animals=true
        function-permission-level=2
        spawn-monsters=true
        enforce-whitelist=false
        spawn-protection=16
        resource-pack-sha1=
        max-world-size=29999984
        EOF
        echo "✅ server.properties создан"
    
    - name: Create eula.txt
      run: |
        echo "eula=true" > eula.txt
        echo "✅ eula.txt создан"
    
    - name: Start Minecraft server
      run: |
        echo "Запускаем Minecraft сервер..."
        
        # Запускаем сервер и перенаправляем вывод в файл
        java -Xmx1024M -Xms1024M -jar paper.jar nogui > server.log 2>&1 &
        SERVER_PID=$!
        
        echo "PID сервера: $SERVER_PID"
        
        # Ждем загрузки с проверкой каждые 5 секунд
        echo "Ожидаем загрузки сервера..."
        for i in {1..12}; do
          sleep 5
          if grep -q "Done" server.log 2>/dev/null; then
            echo "✅ Сервер успешно запущен!"
            break
          fi
          if [ $i -eq 12 ]; then
            echo "❌ Сервер не запустился за 60 секунд. Логи:"
            cat server.log
            exit 1
          fi
        done
        
        # Проверяем, что процесс жив
        if ps -p $SERVER_PID > /dev/null 2>&1; then
          echo "✅ Процесс сервера активен (PID: $SERVER_PID)"
        else
          echo "❌ Процесс сервера завершился. Логи:"
          cat server.log
          exit 1
        fi
    
    - name: Setup Serveo tunnel
      run: |
        echo "Устанавливаем SSH клиент..."
        sudo apt-get update
        sudo apt-get install -y openssh-client
        
        echo "Создаем туннель через Serveo..."
        # Создаем туннель с фиксированным поддоменом
        ssh -o StrictHostKeyChecking=no -R SilentSMP.serveo.net:80:localhost:25565 serveo.net &
        
        sleep 15
        
        echo ""
        echo "=================================================="
        echo "✅ СЕРВЕР ЗАПУЩЕН И ДОСТУПЕН!"
        echo "📍 Адрес: SilentSMP.serveo.net"
        echo "🔌 Порт: 25565"
        echo "=================================================="
    
    - name: Keep server running
      run: |
        echo ""
        echo "🟢 Сервер работает и доступен по адресу SilentSMP.serveo.net:25565"
        echo "📝 Логи сервера:"
        echo "=================================================="
        # Показываем логи из server.log, а не nohup.out
        tail -f server.log
